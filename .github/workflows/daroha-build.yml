name: Daroha Group - compilar clientes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release (prerelease) donde se suben los instaladores"
        default: "daroha-1.5.3"

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag }}
      publish-update-metadata: false

  rename-assets:
    # Renombra rustdesk-* -> DarohaGroup-* en el release (aunque falle alguna plataforma)
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Renombrar archivos del release
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"' |
          while read -r id name; do
            case "$name" in
              rustdesk-*)
                new="DarohaGroup-${name#rustdesk-}"
                new="${new/-signed.apk/.apk}"
                echo "$name -> $new"
                gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" -f name="$new" >/dev/null
                ;;
            esac
          done
